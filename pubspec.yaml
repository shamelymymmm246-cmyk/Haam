name: haam_counter
description: "حام — درع حماية وخصوصية محلي للأندرويد (Haam — local-only Android privacy & security shield)"

publish_to: 'none'

version: 1.3.1+2

environment:
  sdk: ^3.2.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  # المرحلة 1 — DNS
  flutter_secure_storage: ^9.2.2
  # المرحلة 2 — جامعو الإشارات
  permission_handler: ^11.3.1
  # المرحلة 6 — قفل بيومتري/PIN
  local_auth: ^2.3.0
  # المرحلة 4 — المراقبة الخلفية والإشعارات
  workmanager: ^0.9.0+3
  flutter_local_notifications: ^17.2.4
  # الخزنة المشفّرة — اختيار الملفات وتخزينها وتشفيرها AES-256
  file_picker: ^8.1.2
  path_provider: ^2.1.4
  encrypt: ^5.0.3
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.3
  mockito: ^5.4.4
  build_runner: ^2.4.9

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
